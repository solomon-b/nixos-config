      zones:
        - name: "Apple Row"
          entity_id: "switch.manifold_20"
          schedules:
            - time: "07:00"
              weekday: [tue]
        - name: "Pear Row"
          entity_id: "switch.manifold_21"
          schedules:
            - time: "07:00"
